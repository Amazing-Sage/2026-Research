name: Verilog Check

on:
  push:
    branches: [ main ]
  workflow_dispatch:

jobs:
  verilog-check:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Install Icarus Verilog
        run: sudo apt-get update && sudo apt-get install -y iverilog

      - name: Compile LIF neuron
        run: |
          iverilog -g2012 \
            -I Verilog/design1_tiled/LIF_neuron \
            -o lif_neuron_test \
            Verilog/design1_tiled/LIF_neuron/lif_neuron.v \
            Verilog/design1_tiled/Memory_till/weight_buff.v \
            Verilog/design1_tiled/bw_multiplier/Booth/bw_multiplier.v \
            Verilog/design1_tiled/bw_multiplier/Booth/bw_encoder.v \
            Verilog/design1_tiled/bw_multiplier/Booth/bw_gen.v \
            Verilog/design1_tiled/bw_multiplier/Booth/bw_partial_product.v \
            Verilog/design1_tiled/bw_multiplier/Wallace/CPA.v
